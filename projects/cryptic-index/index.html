<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cryptic Index 🔍</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1><u>Cryptic Index 🔍</u></h1>

    <p>
      Used for both solving and constructing crypting crosswords. Filter by indicator type, or search for specific words/phrases.
    </p>

    <p>
      Amalgamated from a bunch of different places, so there is a bit of noise, inconsistencies, and duplication.
    </p>

    <p>
      <input id="search" placeholder="Type something" size="20" autocorrect="off"
        autocapitalize="none" autocomplete="off" spellcheck="false">
      <button id="clear">Clear</button>
    </p>

    <p id="types"></p>

    <p id="reminder"></p>

    <p id="count">
      <span id="countText"></span>
      <button id="showAll">Show all</button>
    </p>

    <table id="results"></table>

    <script src="indicators.js"></script>
    <script src="index.js"></script>
  </body>
</html>
